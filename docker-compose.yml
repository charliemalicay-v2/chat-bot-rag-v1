# Chat RAG Bot V1 - Docker Compose
#
#   db       MySQL 8.4             conversations, messages, products
#   vector   PostgreSQL + pgvector document chunks + embeddings
#   backend  Django REST API (Ollama + embedder are added to this container)
# The `frontend` service is added in Phase 6.
#
# Setup: cp .env.example .env   (compose reads .env for ${VAR} substitution)

name: chat-rag-bot

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?copy .env.example to .env}
      MYSQL_USER: ${MYSQL_USER:?copy .env.example to .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env}
    ports:
      # Bound to localhost only. Host port is configurable to avoid clashing
      # with a MySQL already installed on the machine.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Runs once, on first start of an empty volume (grants test-DB rights).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  vector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume.
      - ./vector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP. During first-run init Postgres listens on the
      # unix socket only, so this stays unhealthy until init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true   # tini as PID 1: reaps the ollama child, forwards signals
    env_file: .env
    environment:
      # Let the frontend container reach the API as http://backend:8000
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},backend
    depends_on:
      db:
        condition: service_healthy
      vector:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ollama_models:/root/.ollama   # downloaded LLM weights
    healthcheck:
      # /live only proves Django is up. The first-start model download keeps
      # going in the background; GET /api/health/ shows when the LLM is ready.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/live/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
  pg_data:
  ollama_models:
